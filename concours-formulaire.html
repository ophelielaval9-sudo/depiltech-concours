<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeu concours Dépil Tech</title><style>body{margin:0;background:#faf8f7;font:16px system-ui;color:#32232a}main{max-width:520px;margin:auto;padding:24px}label{display:block;margin:16px 0}input:not([type=checkbox]),select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit}button{width:100%;padding:16px;border:0;border-radius:8px;background:#67253e;color:white;font:inherit}small{display:block;margin:16px 0}</style><main><h1>Jeu concours</h1><h2 id="centre"></h2><small>Mode aperçu — aucune donnée enregistrée.</small><form id="f"><label>Prénom<input name="prenom" required maxlength="100" autocomplete="given-name"></label><label>Nom<input name="nom" required maxlength="100" autocomplete="family-name"></label><label>E-mail<input name="email" type="email" autocomplete="email"></label><label>Téléphone<input name="telephone" type="tel" autocomplete="tel"></label><label>Commerçant (facultatif)<input name="commerce" maxlength="150"></label><label>Âge<select name="majorite" required><option value="">Sélectionner</option><option value="adult">18 ans ou plus</option><option value="minor">17 ans</option></select></label><label>Zones qui vous intéressent (facultatif)<input name="zones" maxlength="200"></label><label>Disponibilités (facultatif)<input name="disponibilites" maxlength="200"></label><label><input name="marketing" type="checkbox"> Je souhaite recevoir les offres du centre (facultatif, réservé aux adultes).</label><label><input name="rules" type="checkbox" required> J’accepte le règlement (aperçu)</label><div hidden><input name="website" tabindex="-1" autocomplete="off"></div><button>Tester la participation</button></form><p id="result" role="status"></p></main><script>const c=new URLSearchParams(location.search).get('centre');const names={rennes:'Rennes',quimper:'Quimper','saint-brieuc':'Saint-Brieuc',1:'Rennes',2:'Quimper',3:'Saint-Brieuc'};document.getElementById('centre').textContent=names[c]||'Centre non identifié';const f=document.getElementById('f');if(!names[c])f.hidden=true;f.elements.majorite.addEventListener('change',()=>{f.elements.marketing.disabled=f.elements.majorite.value!=='adult';if(f.elements.marketing.disabled)f.elements.marketing.checked=false;});f.elements.marketing.disabled=true;f.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(!d.email.trim()&&!d.telephone.trim()){document.getElementById('result').textContent='Indiquez au moins un moyen de contact.';return;}if(d.majorite!=='adult')delete d.marketing;const result=document.getElementById('result');const b=f.querySelector('button');b.disabled=true;try{const response=await fetch('https://efrrcmxcqodxcycpbetp.supabase.co/functions/v1/concours-public',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...d,centre_id:({rennes:1,quimper:2,'saint-brieuc':3})[c]||Number(c),rules:d.rules==='on'})});const data=await response.json();if(!response.ok||!data.ok||!data.preview)throw Error();f.hidden=true;result.textContent='Test réussi. Aucune participation réelle enregistrée.'}catch{result.textContent='Impossible de valider le test. Vérifiez vos coordonnées et réessayez.'}finally{b.disabled=false}});</script></html>
