<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeu concours Dépil Tech</title><style>body{margin:0;background:#faf8f7;font:16px system-ui;color:#32232a}main{max-width:520px;margin:auto;padding:24px}label{display:block;margin:16px 0}input:not([type=checkbox]),select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit}button{width:100%;padding:16px;border:0;border-radius:8px;background:#67253e;color:white;font:inherit}small{display:block;margin:16px 0}.optional{font-size:11px;font-weight:400;color:#777}fieldset{border:0;padding:0;margin:20px 0;min-width:0}legend{padding:0;margin-bottom:10px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choices label{position:relative;margin:0;cursor:pointer}.choices input{position:absolute;opacity:0;width:1px;height:1px}.choices span{display:block;padding:10px 8px;border:1px solid #ddd;border-radius:8px;background:white;font-size:14px;text-align:center}.choices input:checked+span{background:#e2f1e5;border-color:#428452;color:#235c34}.choices input:focus-visible+span{outline:2px solid #67253e}</style><main><h1>Jeu concours</h1><h2 id="centre"></h2><small>Mode aperçu — aucune donnée enregistrée.</small><form id="f"><label>Prénom<input name="prenom" required maxlength="100" autocomplete="given-name"></label><label>Nom<input name="nom" required maxlength="100" autocomplete="family-name"></label><label>E-mail<input name="email" type="email" autocomplete="email"></label><label>Téléphone<input name="telephone" type="tel" autocomplete="tel"></label><label>Commerçant <span class="optional">(facultatif)</span><select name="commerce_id" id="commerce"><option value="">Aucun / Je ne sais pas</option></select><small id="commerce-info" aria-live="polite"></small></label><label>Âge<select name="majorite" required><option value="">Sélectionner</option><option value="adult">18 ans ou plus</option><option value="minor">17 ans</option></select></label><fieldset><legend>Zones qui vous intéressent <span class="optional">(facultatif)</span></legend><div class="choices"><label><input type="checkbox" name="zones" value="Lèvre supérieure"><span>Lèvre supérieure</span></label><label><input type="checkbox" name="zones" value="Menton"><span>Menton</span></label><label><input type="checkbox" name="zones" value="Sourcils"><span>Sourcils</span></label><label><input type="checkbox" name="zones" value="Barbe"><span>Barbe</span></label><label><input type="checkbox" name="zones" value="Aisselles"><span>Aisselles</span></label><label><input type="checkbox" name="zones" value="Maillot"><span>Maillot</span></label><label><input type="checkbox" name="zones" value="Rond de fesses"><span>Rond de fesses</span></label><label><input type="checkbox" name="zones" value="Jambes"><span>Jambes</span></label><label><input type="checkbox" name="zones" value="Dos"><span>Dos</span></label><label><input type="checkbox" name="zones" value="Torse"><span>Torse</span></label><label><input type="checkbox" name="zones" value="Épaule"><span>Épaule</span></label><label><input type="checkbox" name="zones" value="Nuque"><span>Nuque</span></label><label><input type="checkbox" name="zones" value="Bras"><span>Bras</span></label><label><input type="checkbox" name="zones" value="Ventre"><span>Ventre</span></label></div></fieldset><fieldset><legend>Disponibilités pour être contacté(e) <span class="optional">(facultatif)</span></legend><div class="choices"><label><input type="checkbox" name="disponibilites" value="Matin"><span>Matin</span></label><label><input type="checkbox" name="disponibilites" value="Midi"><span>Midi</span></label><label><input type="checkbox" name="disponibilites" value="Après-midi"><span>Après-midi</span></label><label><input type="checkbox" name="disponibilites" value="Soir"><span>Soir</span></label><label><input type="checkbox" name="disponibilites" value="Samedi"><span>Samedi</span></label></div></fieldset><label><input name="marketing" type="checkbox"> Je souhaite recevoir les offres du centre <span class="optional">(facultatif, réservé aux adultes)</span>.</label><label><input name="rules" type="checkbox" required> J’accepte le règlement (aperçu)</label><div hidden><input name="website" tabindex="-1" autocomplete="off"></div><button>Tester la participation</button></form><p id="result" role="status"></p></main><script>const c=new URLSearchParams(location.search).get('centre');const names={rennes:'Rennes',quimper:'Quimper','saint-brieuc':'Saint-Brieuc',1:'Rennes',2:'Quimper',3:'Saint-Brieuc'};document.getElementById('centre').textContent=names[c]||'Centre non identifié';const f=document.getElementById('f');if(!names[c])f.hidden=true;const centreId=({rennes:1,quimper:2,'saint-brieuc':3})[c]||Number(c);async function loadCommerces(){const info=document.getElementById('commerce-info');const select=document.getElementById('commerce');info.textContent='Chargement des commerces…';try{const url='https://efrrcmxcqodxcycpbetp.supabase.co/rest/v1/concours_commerces_public?select=id,nom&centre_id=eq.'+centreId+'&order=nom.asc';const response=await fetch(url,{headers:{apikey:"sb_publishable_5BHu5QNw0cA3pzaEfm8gRg_ETWAo33k"}});if(!response.ok)throw Error();const rows=await response.json();for(const row of rows){const option=document.createElement('option');option.value=String(row.id);option.textContent=row.nom;select.append(option);}info.textContent=rows.length?'':'Aucun commerce disponible pour le moment.';}catch{info.textContent='Liste temporairement indisponible. Vous pouvez continuer sans sélectionner de commerce.';}}if(names[c])loadCommerces();f.elements.majorite.addEventListener('change',()=>{f.elements.marketing.disabled=f.elements.majorite.value!=='adult';if(f.elements.marketing.disabled)f.elements.marketing.checked=false;});f.elements.marketing.disabled=true;f.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(f);const d=Object.fromEntries(fd);d.zones=fd.getAll('zones');d.disponibilites=fd.getAll('disponibilites');if(!d.email.trim()&&!d.telephone.trim()){document.getElementById('result').textContent='Indiquez au moins un moyen de contact.';return;}if(d.majorite!=='adult')delete d.marketing;const result=document.getElementById('result');const b=f.querySelector('button');b.disabled=true;try{const response=await fetch('https://efrrcmxcqodxcycpbetp.supabase.co/functions/v1/concours-public',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...d,commerce_id:d.commerce_id?Number(d.commerce_id):null,centre_id:({rennes:1,quimper:2,'saint-brieuc':3})[c]||Number(c),rules:d.rules==='on'})});const data=await response.json();if(!response.ok||!data.ok||!data.preview)throw Error();f.hidden=true;result.textContent='Test réussi. Aucune participation réelle enregistrée.'}catch{result.textContent='Impossible de valider le test. Vérifiez vos coordonnées et réessayez.'}finally{b.disabled=false}});</script></html>
